<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Thumbnailer</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header>
    <h1>Site Thumbnailer</h1>
    <p class="sub">Enter a website to grab its title, description, URL and a snapshot.</p>
    <form id="capture-form" autocomplete="off">
      <input id="url" name="url" type="text" inputmode="url" placeholder="example.com" required aria-label="Website URL">
      <button type="submit" id="submit">Capture</button>
    </form>
    <div class="toolbar">
      <p id="status" role="status" aria-live="polite"></p>
      <div class="pickers">
        <label class="size-picker">Layout
          <select id="layout">
            <option value="grid">Grid</option>
            <option value="masonry">Masonry</option>
          </select>
        </label>
        <label class="size-picker">Thumbnail size
          <select id="size"></select>
        </label>
        <label class="size-picker">Text size
          <select id="text-size">
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
          </select>
        </label>
        <label class="size-picker" id="desc-default-picker">Descriptions
          <select id="desc-default">
            <option value="collapsed">Collapsed</option>
            <option value="expanded">Expanded</option>
          </select>
        </label>
      </div>
    </div>
  </header>
  <main>
    <p id="empty" hidden>No sites captured yet. Try one above.</p>
    <ul id="sites"></ul>
  </main>
  <template id="card-tpl">
    <li class="card">
      <a class="thumb-link" target="_blank" rel="noopener noreferrer">
        <img class="thumb" alt="" loading="lazy">
        <span class="placeholder" hidden><span class="initial"></span><span>No preview available</span></span>
      </a>
      <div class="body">
        <h2 class="title"></h2>
        <span class="badge" hidden>Basic capture</span>
        <p class="site-name"></p>
        <p class="desc"></p>
        <button type="button" class="desc-toggle" aria-expanded="false" hidden>Show more</button>
        <div class="desc-pop" hidden>
          <p class="desc-full"></p>
          <button type="button" class="pop-close">Show less</button>
        </div>
        <a class="url" target="_blank" rel="noopener noreferrer"></a>
        <div class="meta">
          <time class="when"></time>
          <span class="actions">
            <button type="button" class="refresh">Refresh</button>
            <button type="button" class="delete">Delete</button>
          </span>
        </div>
      </div>
    </li>
  </template>
</body>
</html>
